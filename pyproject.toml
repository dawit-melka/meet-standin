[project]
name = "meet-standin"
version = "0.1.0"
description = "Telegram-controlled stand-in that joins a Google Meet and plays a prerecorded update."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.51",
    "python-dotenv>=1.0",
    "python-telegram-bot>=21.0",
]

[project.scripts]
meet-standin = "meet_standin.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "meet_standin"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
